  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100svh; background: var(--surface); color: var(--ink); font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }

  .brand svg { width: 2rem; height: 2rem; }
  main { display: grid; min-height: calc(100svh - 6rem); place-content: center; padding: 2rem 1.5rem 5rem; text-align: center; }
  .illustration { width: min(17rem, 75vw); margin: 0 auto 1.5rem; border-radius: 50%; background: var(--paper); }
  .illustration svg { display: block; width: 100%; height: auto; }
  .code { margin: 0 0 .75rem; color: var(--muted); font: .75rem ui-monospace, monospace; letter-spacing: .12em; }
  h1 { margin: 0; font: 700 clamp(1.75rem, 5vw, 2.25rem)/1.2 "Trebuchet MS", ui-sans-serif, sans-serif; letter-spacing: -.03em; }
  .description { max-width: 29rem; margin: 1rem auto 1.75rem; color: var(--muted); font-size: .9375rem; line-height: 1.7; }
  .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: .75rem; }
  .button { display: inline-flex; align-items: center; justify-content: center; min-height: 2.75rem; padding: .65rem 1.15rem; border: 1px solid transparent; border-radius: .5rem; background: var(--button); color: var(--button-text); text-decoration: none; font-size: .875rem; font-weight: 600; }
  .button.secondary { border-color: var(--line); background: transparent; color: var(--ink); }
  a:hover { filter: brightness(.9); }
  a:focus-visible { outline: 3px solid var(--button); outline-offset: 4px; }
  @media (prefers-color-scheme: dark) { :root { --paper: #233654; --surface: #171f2e; --ink: #edf3ff; --muted: #b8c9e2; --line: #415775; --button: #96b9f6; --button-text: #17243b; } }
