name: Publish Docker Image

on:
  # Master builds publish only after CI passes on the same SHA (issue #287):
  # a red build must never push the nightly tag README tells users to run.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["master"]
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# A moving nightly tag must not be overwritten by an older master run.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  check-and-publish:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    # workflow_run fires for every CI completion on master; publish only when
    # the upstream CI run succeeded. Tag and dispatch events are unaffected.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    permissions:
      contents: write
      actions: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # For workflow_run events check out the exact SHA CI validated,
          # not the workflow file's own ref.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
          no-cache: true

      - name: Determine build version and channel
        id: version
        run: |
          # Version tags publish the production image; validated master HEADs
          # publish the rolling dogfood image. Manual dispatch retains the
          # latest fallback.
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            pkg_version=$(bun -e "console.log(String(require('./package.json').version ?? '0.0.0'))" 2>/dev/null || echo "0.0.0")
            echo "version=${pkg_version}" >> "$GITHUB_OUTPUT"
            if [[ "${GITHUB_REF}" == refs/heads/master && ("${GITHUB_EVENT_NAME}" == push || "${GITHUB_EVENT_NAME}" == workflow_run) ]]; then
              echo "tag=nightly" >> "$GITHUB_OUTPUT"
            else
              echo "tag=latest" >> "$GITHUB_OUTPUT"
            fi
          fi
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an immutable release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}"
          if docker manifest inspect "$image" > /dev/null 2>&1; then
            echo "Refusing to overwrite existing immutable image tag $image" >&2
            exit 1
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
            type=raw,value=nightly,enable=${{ (github.event_name == 'push' || github.event_name == 'workflow_run') && github.ref == 'refs/heads/master' }}
            type=raw,value=${{ steps.version.outputs.tag }},enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,format=short

      - name: Download tested CLI/provider evidence from the validated CI run
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ github.event.workflow_run.id }}" --name cli-compatibility-report --dir release-evidence || true

      - name: Download tested CLI/provider evidence for the stable commit
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [[ -z "$run_id" ]]; then
            echo "No successful CI run found for stable release commit $GITHUB_SHA" >&2
            exit 1
          fi
          gh run download "$run_id" --name cli-compatibility-report --dir release-evidence

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            BUILD_VERSION=${{ steps.version.outputs.version }}
            BUILD_SHA=${{ steps.version.outputs.sha_short }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          outputs: type=image,name=ghcr.io/${{ github.repository }},push=true

      - name: Write redacted build manifest
        run: |
          set -euo pipefail
          evidence_args=()
          if [[ -d release-evidence ]]; then evidence_args=(--evidence-dir release-evidence); fi
          bun backend/scripts/build-manifest.ts \
            --output build-manifest.json \
            --version "${{ steps.version.outputs.version }}" \
            --commit "$(git rev-parse HEAD)" \
            --image "ghcr.io/${{ github.repository }}:${{ steps.version.outputs.tag }}" \
            --digest "${{ steps.build.outputs.digest }}" \
            "${evidence_args[@]}"

      - name: Upload redacted build manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-manifest-${{ steps.version.outputs.tag }}
          path: build-manifest.json
          retention-days: 365

      - name: Publish immutable release notes
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          {
            echo "Stable image: `ghcr.io/${GITHUB_REPOSITORY}:${GITHUB_REF_NAME}@${{ steps.build.outputs.digest }}`"
            echo
            echo "The attached build manifest records the validated commit, image digest, migration digests, and redacted CLI/provider evidence."
            echo
            cat build-manifest.json
          } > release-notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Terrence $GITHUB_REF_NAME" --generate-notes --notes-file release-notes.md build-manifest.json
