name: Publish Docker Image (hotfix, skip checks)

# Emergency/skip-checks publish: builds the amd64 image from the checked-out
# code alone and pushes :latest. No QEMU multi-arch, no SBOM attestation,
# no parallel quality gates — a 2-4 minute path for getting a fix to a test
# box (or prod) fast without burning private-repo actions minutes.

on:
  push:
    tags:
      - 'hotfix/*'

jobs:
  hotfix-publish:
    name: Build amd64 and Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push (amd64 only)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max