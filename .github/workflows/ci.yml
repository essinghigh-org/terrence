name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (SQLite)
        env:
          # Raises the tofu release-lookup ceiling from 60/hr (per shared
          # runner IP) to 5000/hr when both matrix jobs run e2e downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd backend && bun test

  backend-postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terrence
          POSTGRES_PASSWORD: terrence
          POSTGRES_DB: terrence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (Postgres)
        env:
          DATABASE_URL: postgres://terrence:terrence@localhost:5432/terrence_test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd backend && bun test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        env:
          # bun's parallel workers race initializing stderr WriteStreams when a
          # failing test's error dump goes through picocolors/babel code-frame
          # (EEXIST: epoll_ctl crashes the worker mid-run). NO_COLOR keeps both
          # libraries on their non-color paths, which never touch the stream.
          NO_COLOR: "1"
        # CI runners (2 vCPU) starve bun's default 5s per-test timeout under
        # --parallel=8; DOM-rendering tests that chain several findBy* waits
        # need headroom. 15s only bounds hung tests: passing runs still finish
        # in ~10s wall.
        run: cd frontend && bun test --timeout 15000 --preload ./tests/setup.ts --parallel=8
      - name: Frontend build
        run: cd frontend && bun run build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      - name: Lint
        run: bun run lint
      - name: Knip
        run: bun run knip
      - name: Security endpoint coverage (todo 143)
        run: bun test backend/tests/unit/endpoint-policy-compliance.test.ts
      - name: Secret fingerprint check (todo 116)
        run: bun test backend/tests/worker/env-isolation.test.ts

  # Supply-chain / artifact verification (todos 828, 889, 800).
  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend build (reproducible)
        run: cd frontend && bun run build
      - name: Docker build check (todo 828)
        run: |
          docker build -f Dockerfile --target builder -t terrence:ci-builder . > /tmp/docker-build.log 2>&1 || (cat /tmp/docker-build.log; exit 1)
          echo "Docker builder stage OK"
      - name: Bundle size budget (todo 800)
        run: |
          node -e '
            const fs=require("fs"), path=require("path");
            const dist="frontend/dist";
            if(!fs.existsSync(dist)){console.error("frontend/dist is missing");process.exit(1)}
            const files=(function walk(d){return fs.readdirSync(d,{withFileTypes:true}).flatMap(e=>e.isDirectory()?walk(path.join(d,e.name)):[path.join(d,e.name)])})(dist);
            const total=files.reduce((s,f)=>s+fs.statSync(f).size,0);
            const budget=6*1024*1024; // 6 MiB initial budget for frontend/dist
            console.log(`bundle total ${(total/1024/1024).toFixed(2)} MiB (budget ${(budget/1024/1024).toFixed(2)} MiB)`);
            if(total>budget){console.error(`bundle exceeds budget by ${((total-budget)/1024).toFixed(0)} KiB`);process.exit(1)}
          '
      - name: Reproducible lockfile check (todo 889)
        run: |
          bun install --frozen-lockfile
          git diff --exit-code -- bun.lock

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static frontend
        run: cd frontend && bun run build
      - name: Run axe on static preview (no token, no backend)
        working-directory: frontend
        run: |
          set -o pipefail
          npx playwright install --with-deps chromium 2>&1 | tail -n 5
          npx playwright --version
          node -e "require.resolve('@playwright/test'); require.resolve('@axe-core/playwright'); console.log('axe toolchain OK')"
          # vite preview serves the built dist without an API; the static spec
          # only hits unauthenticated routes and is the real gate.
          npx playwright test -c playwright-static.config.ts 2>&1 | tail -n 80
