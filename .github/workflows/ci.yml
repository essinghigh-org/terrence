name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (SQLite)
        env:
          # Raises the tofu release-lookup ceiling from 60/hr (per shared
          # runner IP) to 5000/hr when both matrix jobs run e2e downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd backend && bun test

  backend-postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terrence
          POSTGRES_PASSWORD: terrence
          POSTGRES_DB: terrence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (Postgres)
        env:
          DATABASE_URL: postgres://terrence:terrence@localhost:5432/terrence_test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: cd backend && bun test

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        env:
          # bun's parallel workers race initializing stderr WriteStreams when a
          # failing test's error dump goes through picocolors/babel code-frame
          # (EEXIST: epoll_ctl crashes the worker mid-run). NO_COLOR keeps both
          # libraries on their non-color paths, which never touch the stream.
          NO_COLOR: "1"
        # CI runners (2 vCPU) starve bun's default 5s per-test timeout under
        # --parallel=8; DOM-rendering tests that chain several findBy* waits
        # need headroom. 15s only bounds hung tests: passing runs still finish
        # in ~10s wall.
        run: cd frontend && bun test --timeout 15000 --preload ./tests/setup.ts --parallel=8
      - name: Frontend build
        run: cd frontend && bun run build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Typecheck
        run: bun run typecheck
      # Lint debt (~1.5k pre-existing errors across the monorepo, mostly
      # stylistic strict-type-checked rules) predates the Checks job and is
      # tracked for a dedicated cleanup slice. Non-blocking until then so the
      # gate reports Typecheck + Knip regressions without drowning them out.
      - name: Lint (non-blocking)
        run: bun run lint
        continue-on-error: true
      - name: Knip
        run: bun run knip
