<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 - Page not found</title>
<meta name="robots" content="noindex">
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #1e2023;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { text-align: center; padding: 2rem; max-width: 28rem; }
  .code { font-size: 3.5rem; font-weight: 700; letter-spacing: -0.02em; line-height: 1; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 1rem 0 0.5rem; }
  p { color: #4a4d52; font-size: 0.9rem; margin: 0 0 1.75rem; }
  a {
    display: inline-block;
    background: #1e2023;
    color: #ffffff;
    text-decoration: none;
    font-size: 0.875rem;
    font-weight: 500;
    padding: 0.6rem 1.25rem;
    border-radius: 0.5rem;
  }
  a:hover { background: #33363a; }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This page does not exist or may have moved.</p>
  <a href="/app">Go to dashboard</a>
</main>
</body>
</html>
