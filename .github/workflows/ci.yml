name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

permissions: read-all

jobs:
  backend-sqlite:
    name: Backend (SQLite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (SQLite)
        env:
          # Raises the tofu release-lookup ceiling from 60/hr (per shared
          # runner IP) to 5000/hr when both matrix jobs run e2e downloads.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Some historical fixtures still use plaintext tokens; scope the
        # migration compatibility flag to that test process only.
        run: cd backend && TERRENCE_ALLOW_LEGACY_TOKENS=1 bun test
      - name: Verify legacy tokens require explicit opt-in
        run: cd backend && bun test tests/api/auth_legacy_default.test.ts

  backend-postgres:
    name: Backend (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: terrence
          POSTGRES_PASSWORD: terrence
          POSTGRES_DB: terrence_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run backend tests (Postgres)
        env:
          DATABASE_URL: postgres://terrence:terrence@localhost:5432/terrence_test
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Some historical fixtures still use plaintext tokens; scope the
        # migration compatibility flag to that test process only.
        run: cd backend && TERRENCE_ALLOW_LEGACY_TOKENS=1 bun test
      - name: Verify legacy tokens require explicit opt-in
        env:
          DATABASE_URL: postgres://terrence:terrence@localhost:5432/terrence_test
        run: cd backend && bun test tests/api/auth_legacy_default.test.ts

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run frontend tests
        env:
          NO_COLOR: "1"
        run: cd frontend && bun run test
      - name: Frontend build
        run: cd frontend && bun run build

  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Verify Bun runtime version
        run: bun run check:bun-version
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Check lockfile deduplication
        run: bun run deps:dedupe:check
      - name: Typecheck
        run: bun run typecheck
      - name: Lint (baseline report)
        run: bun run lint
        continue-on-error: true
      - name: Lint debt budget
        run: bun run lint:budget
      - name: Knip
        run: bun run knip
      - name: Security endpoint coverage (todo 143)
        run: bun test backend/tests/unit/endpoint-policy-compliance.test.ts
      - name: Secret fingerprint check (todo 116)
        run: bun test backend/tests/worker/env-isolation.test.ts

  # Supply-chain / artifact verification (todos 828, 889, 800).
  build-verification:
    name: Build verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Frontend build (reproducible)
        run: cd frontend && bun run build
      - name: Docker full build and runtime smoke check (todo 828)
        run: |
          docker build -f Dockerfile -t terrence:ci . > /tmp/docker-build.log 2>&1 || (cat /tmp/docker-build.log; exit 1)
          docker run --rm terrence:ci /usr/bin/bun --version
          echo "Docker image build and runtime smoke check OK"
      - name: Bundle size budget (todo 800)
        run: bun run check:bundle-size

  browser-tests:
    name: Browser & E2E Tests (Bun.WebView)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.0
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Build static frontend
        run: cd frontend && bun run build
      - name: Run browser E2E, accessibility & visual regression suite (Bun.WebView)
        run: cd frontend && bun run test:browser
