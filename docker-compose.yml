services:
  terrence:
    image: ghcr.io/essinghigh-org/terrence:latest
    build:
      context: .
      args:
        TARGETARCH: ${TARGETARCH:-amd64}
    ports:
      - "3000:3000"
    volumes:
      - terrence-storage:/app/backend/storage
    environment:
      - PORT=3000
      - STORAGE_DIR=/app/backend/storage
      - DATABASE_URL=file:/app/backend/storage/terrence.db
      - NODE_ENV=production
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
    # No healthcheck override: the image's own Bun-based HEALTHCHECK (Dockerfile)
    # is authoritative. This image ships no curl binary.


volumes:
  terrence-storage:
