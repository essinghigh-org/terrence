name: Native tfpolicy qualification

on:
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * 2"
  pull_request:
    paths:
      - "tools/tfpolicy-supervisor/**"
      - "tools/tfpolicy-recorder/**"
      - "tools/tfpolicy-engine/**"
      - "backend/bin/landlock-runner.c"
      - "backend/src/**"
      - "backend/drizzle/**"
      - "backend/tests/compat/tfpolicy-owner/**"
      - "backend/package.json"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/tfpolicy-native-qualification.yml"

permissions:
  contents: read

jobs:
  native-facilities:
    name: Native tfpolicy (${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        release: [pinned, latest]
    # The exact known release gates PRs. An upstream release must not silently
    # make unrelated PRs unmergeable; the scheduled canary still fails loudly.
    continue-on-error: ${{ matrix.release == 'latest' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up pinned Bun for real production-worker tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.4
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Fetch and verify official tfpolicy-plugin
        id: plugin
        run: |
          python3 tools/tfpolicy-supervisor/integration/fetch_plugin.py \
            --release '${{ matrix.release }}' --output "$RUNNER_TEMP/official-plugin"
      - name: Build sandbox helper without changing host settings
        run: |
          gcc -O2 -Wall -Wextra -Werror backend/bin/landlock-runner.c -o "$RUNNER_TEMP/landlock-runner"
          chmod 0555 "$RUNNER_TEMP/landlock-runner"
      - name: Prepare user-authorized ephemeral runner isolation
        id: isolation
        run: |
          set -euo pipefail
          # Explicit user authorization: this disposable GitHub-hosted job only.
          # Do not alter the host's controller set or any existing cgroup.
          ROOT="/sys/fs/cgroup/tfpolicy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test ! -e "$ROOT"
          grep -qw pids /sys/fs/cgroup/cgroup.subtree_control
          grep -qw memory /sys/fs/cgroup/cgroup.subtree_control
          cat /proc/sys/kernel/core_pattern > "$RUNNER_TEMP/tfpolicy-original-core-pattern"
          printf '%s\n' "$ROOT" > "$RUNNER_TEMP/tfpolicy-owned-cgroup"
          sudo mkdir "$ROOT"
          echo 512 | sudo tee "$ROOT/pids.max" >/dev/null
          echo 3221225472 | sudo tee "$ROOT/memory.max" >/dev/null
          echo '+pids +memory' | sudo tee "$ROOT/cgroup.subtree_control" >/dev/null
          sudo mkdir "$ROOT/launcher"
          sudo chown "$(id -u):$(id -g)" "$ROOT" "$ROOT/cgroup.procs" "$ROOT/cgroup.threads" "$ROOT/cgroup.subtree_control"
          echo core | sudo tee /proc/sys/kernel/core_pattern >/dev/null
          echo "cgroup_root=$ROOT" >> "$GITHUB_OUTPUT"
      - name: Probe prepared native facilities
        id: facilities
        run: |
          python3 tools/tfpolicy-supervisor/integration/probe.py \
            --runner "$RUNNER_TEMP/landlock-runner" --output "$RUNNER_TEMP/native-capabilities.json" \
            --cgroup-root "${{ steps.isolation.outputs.cgroup_root }}"
      - name: Run transport and qualification-oracle unit tests
        env:
          GOTOOLCHAIN: go1.26.10
        run: |
          (cd tools/tfpolicy-supervisor && go test -race -count=1 -v ./... && go vet ./...)
          (cd tools/tfpolicy-supervisor/integration && python3 -m unittest -v)
      - name: Build and race-test recorder and test-only protocol fixture
        env:
          GOTOOLCHAIN: go1.26.10
          TFPOLICY_TEST_RACE: 1
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/native-bin" "$RUNNER_TEMP/terraform-protocol"
          git -C "$RUNNER_TEMP/terraform-protocol" init
          git -C "$RUNNER_TEMP/terraform-protocol" remote add origin https://github.com/hashicorp/terraform.git
          git -C "$RUNNER_TEMP/terraform-protocol" fetch --depth=1 origin ff6329e4c2a159b46ec2b73d36bfa3d0ef6560c9
          test "$(git -C "$RUNNER_TEMP/terraform-protocol" rev-parse FETCH_HEAD)" = ff6329e4c2a159b46ec2b73d36bfa3d0ef6560c9
          bash tools/tfpolicy-recorder/build.sh "$RUNNER_TEMP/terraform-protocol" "$RUNNER_TEMP/native-bin/recorder"
          bash tools/tfpolicy-supervisor/integration/build-fixture.sh "$RUNNER_TEMP/terraform-protocol" "$RUNNER_TEMP/native-bin/fixture"
          (cd tools/tfpolicy-supervisor && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/native-bin/shim" ./cmd/tfpolicy-shim)
          (cd tools/tfpolicy-supervisor && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/native-bin/supervisor" ./cmd/tfpolicy-supervisor)
      - name: Fetch separately distributed official stock Terraform
        if: steps.facilities.outputs.ready == 'true'
        run: |
          set -euo pipefail
          # Pinned from HashiCorp's official 1.17.1 SHA256SUMS. No engine source build.
          curl --fail --location --retry 3 --proto '=https' --tlsv1.2 \
            https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip \
            -o "$RUNNER_TEMP/terraform.zip"
          echo "4638628058e71a55212b1c563712eac03b902128f40740f3dc8174df12135061  $RUNNER_TEMP/terraform.zip" | sha256sum --check --strict
          unzip "$RUNNER_TEMP/terraform.zip" -d "$RUNNER_TEMP/native-bin/official"
      - name: Run stock-engine transport, sandbox, bootstrap and recorder matrix
        if: steps.facilities.outputs.ready == 'true'
        env:
          DELEGATED_CGROUP: ${{ steps.facilities.outputs.cgroup_root }}
        run: |
          # Enter only our new delegated subtree as root, then immediately drop
          # to the ordinary runner user before the harness or any binary runs.
          # Without this, cgroup migration checks reject the outside-to-leaf move.
          sudo bash -ec 'echo $$ > "$1/launcher/cgroup.procs"; exec runuser -u "$2" -- "${@:3}"' -- \
            "$DELEGATED_CGROUP" "$(id -un)" \
            python3 "$GITHUB_WORKSPACE/tools/tfpolicy-supervisor/integration/run.py" \
            --terraform "$RUNNER_TEMP/native-bin/official/terraform" \
            --terraform-sha256 "$(sha256sum "$RUNNER_TEMP/native-bin/official/terraform" | cut -d ' ' -f 1)" \
            --runner "$RUNNER_TEMP/landlock-runner" --supervisor "$RUNNER_TEMP/native-bin/supervisor" \
            --shim "$RUNNER_TEMP/native-bin/shim" --recorder "$RUNNER_TEMP/native-bin/recorder" \
            --fixture "$RUNNER_TEMP/native-bin/fixture" --cgroup-root "$DELEGATED_CGROUP" \
            --output "$RUNNER_TEMP/native-results"
      - name: Build strict reference engine and owner qualification binary
        if: steps.facilities.outputs.ready == 'true'
        env:
          GOTOOLCHAIN: go1.26.10
          DELEGATED_CGROUP: ${{ steps.isolation.outputs.cgroup_root }}
        run: |
          set -euo pipefail
          bash tools/tfpolicy-engine/build.sh "$RUNNER_TEMP/terraform-protocol" "$RUNNER_TEMP/strict-engine"
          (cd tools/tfpolicy-supervisor && go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/native-bin/owner" ./cmd/tfpolicy-owner)
          (cd tools/tfpolicy-supervisor && go test -c -o "$RUNNER_TEMP/native-bin/owner-tests" ./internal/execution)
          chmod 0555 "$RUNNER_TEMP/native-bin/owner" "$RUNNER_TEMP/native-bin/owner-tests" "$RUNNER_TEMP/native-bin/supervisor" "$RUNNER_TEMP/native-bin/shim"
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          base=Path(os.environ['RUNNER_TEMP'])
          def pin(path):
              with path.open('rb') as stream:
                  return {'path':str(path),'sha256':hashlib.file_digest(stream,'sha256').hexdigest()}
          runtime={name:pin(base/'native-bin'/name) for name in ['supervisor','shim','recorder']}
          runtime.update({'engine':pin(base/'strict-engine/terraform'),'runner':pin(base/'landlock-runner'),'plugin':pin(base/'native-bin/fixture'),'patchSha256':json.loads((base/'strict-engine/provenance.json').read_text())['patchSha256']})
          path=base/'native-owner-profile.json'
          path.write_text(json.dumps({'schemaVersion':1,'runtime':runtime,'cgroupRoot':os.environ['DELEGATED_CGROUP']}))
          path.chmod(0o600)
          PY
      - name: Require strict owner admission matrix with the reference engine
        if: steps.facilities.outputs.ready == 'true'
        env:
          DELEGATED_CGROUP: ${{ steps.isolation.outputs.cgroup_root }}
        run: |
          set -euo pipefail
          sudo bash -ec 'echo $$ > "$1/launcher/cgroup.procs"; shift; exec setpriv --reuid="$1" --regid="$2" --init-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i PATH=/usr/bin:/bin "${@:3}"' -- \
            "$DELEGATED_CGROUP" "$(id -u)" "$(id -g)" \
            "TFPOLICY_OWNER_TEST_PROFILE=$RUNNER_TEMP/native-owner-profile.json" \
            "$RUNNER_TEMP/native-bin/owner-tests" -test.v -test.run='^TestNativeOwner$' -test.timeout=120s \
            | tee "$RUNNER_TEMP/native-owner-results.log"
          grep -q -- '--- PASS: TestNativeOwner ' "$RUNNER_TEMP/native-owner-results.log"
          ! grep -q -- '--- SKIP: TestNativeOwner' "$RUNNER_TEMP/native-owner-results.log"
      - name: Require real-plugin production-worker compatibility
        if: steps.facilities.outputs.ready == 'true'
        env:
          DELEGATED_CGROUP: ${{ steps.isolation.outputs.cgroup_root }}
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_PATH: ${{ steps.plugin.outputs.plugin }}
          PLUGIN_SHA256: ${{ steps.plugin.outputs.sha256 }}
          PLUGIN_ARCHIVE: ${{ steps.plugin.outputs.archive }}
        run: |
          set -euo pipefail
          # No repository/cloud credentials reach the isolated API or plugin.
          # Only terraform_data is used: these tests create no cloud resources.
          BUN_DIR="$(dirname "$(command -v bun)")"
          set +e
          sudo bash -ec 'echo $$ > "$1/launcher/cgroup.procs"; shift; exec setpriv --reuid="$1" --regid="$2" --init-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i "${@:3}"' -- \
            "$DELEGATED_CGROUP" "$(id -u)" "$(id -g)" "PATH=$BUN_DIR:/usr/bin:/bin" \
            python3 "$GITHUB_WORKSPACE/tools/tfpolicy-supervisor/integration/real-owner.py" \
            --owner "$RUNNER_TEMP/native-bin/owner" --profile "$RUNNER_TEMP/native-owner-profile.json" \
            --plugin "$PLUGIN_PATH" --plugin-sha256 "$PLUGIN_SHA256" --plugin-version "$PLUGIN_VERSION" \
            --plugin-archive "$PLUGIN_ARCHIVE" --cgroup-root "$DELEGATED_CGROUP" \
            --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/real-plugin-results" \
            --hosted-worker --cases allow,auto-apply,deny,override,apply-crash,apply-cancel,worker-death,apply-force \
            > "$RUNNER_TEMP/real-plugin-private.log" 2>&1
          status=$?
          set -e
          # Assert the full requested matrix, rather than accepting a skipped or
          # partial result. Publish only synthetic case status, never plugin logs.
          HARNESS_STATUS="$status" python3 - <<'PY'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          path = base/'real-plugin-results/api/summary.json'
          expected = ['allow','auto-apply','deny','override','apply-crash','apply-cancel','worker-death','apply-force']
          rows = json.loads(path.read_text())['hostedWorkerCases'] if path.exists() else []
          passed = [r['mode'] for r in rows if r['passed'] is True]
          assert passed == expected[:len(rows)], 'unexpected compatibility case results'
          success = os.environ['HARNESS_STATUS'] == '0' and passed == expected
          summary = {'version': os.environ['PLUGIN_VERSION'], 'passed': passed, 'success': success,
                     'firstIncompleteCase': None if passed == expected else expected[len(passed)]}
          (base/'real-plugin-summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Official tfpolicy-plugin '+summary['version']+': '+str(len(passed))+'/'+str(len(expected))+' hosted functional compatibility cases passed.\n')
              if not success:
                  output.write('First incomplete case: '+str(summary['firstIncompleteCase'])+'. Raw plugin output remains private on the ephemeral runner.\n')
          if not success:
              raise SystemExit('Real-plugin compatibility failed; see the case summary.')
          PY
      - name: Set up Rust for the pinned production agent
        if: steps.facilities.outputs.ready == 'true'
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1
        with:
          toolchain: "1.99.1"
          cache: false
      - name: Build the exact matching agent and its state sandbox
        if: steps.facilities.outputs.ready == 'true'
        env:
          AGENT_REVISION: 369e5cb7cbf07a0f83e5d996d72bb5a5ce78668b
          SERVER_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init "$RUNNER_TEMP/terrence-agent"
          git -C "$RUNNER_TEMP/terrence-agent" remote add origin https://github.com/essinghigh-org/terrence-agent.git
          git -C "$RUNNER_TEMP/terrence-agent" fetch --depth=1 origin "$AGENT_REVISION"
          test "$(git -C "$RUNNER_TEMP/terrence-agent" rev-parse FETCH_HEAD)" = "$AGENT_REVISION"
          git -C "$RUNNER_TEMP/terrence-agent" checkout --detach FETCH_HEAD
          cargo build --locked --release --manifest-path "$RUNNER_TEMP/terrence-agent/Cargo.toml" --target-dir "$RUNNER_TEMP/agent-target"
          sh "$RUNNER_TEMP/terrence-agent/bin/build-landlock-runner.sh"
          install -m 0555 "$RUNNER_TEMP/agent-target/release/terrence-agent" "$RUNNER_TEMP/native-bin/terrence-agent"
          install -m 0555 "$RUNNER_TEMP/terrence-agent/bin/landlock-runner" "$RUNNER_TEMP/native-bin/agent-landlock-runner"
          python3 - <<'PYTHON'
          import hashlib, json, os, subprocess
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          def sha256(path):
              with path.open('rb') as source:
                  return hashlib.file_digest(source, 'sha256').hexdigest()
          provenance = {
              'serverHead': os.environ['SERVER_HEAD'],
              'serverCheckout': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'agentRevision': os.environ['AGENT_REVISION'],
              'agentSha256': sha256(base/'native-bin/terrence-agent'),
              'agentRunnerSha256': sha256(base/'native-bin/agent-landlock-runner'),
              'rustc': subprocess.check_output(['rustc', '--version'], text=True).strip(),
          }
          (base/'native-agent-provenance.json').write_text(json.dumps(provenance, indent=2)+'\n')
          PYTHON
      - name: Require real-plugin production-agent compatibility
        if: steps.facilities.outputs.ready == 'true'
        env:
          DELEGATED_CGROUP: ${{ steps.isolation.outputs.cgroup_root }}
          PLUGIN_VERSION: ${{ steps.plugin.outputs.version }}
          PLUGIN_PATH: ${{ steps.plugin.outputs.plugin }}
          PLUGIN_SHA256: ${{ steps.plugin.outputs.sha256 }}
          PLUGIN_ARCHIVE: ${{ steps.plugin.outputs.archive }}
        run: |
          set -euo pipefail
          # Reuse the owned isolation without granting extra host privileges.
          # The API, agent and plugin inherit no CI or repository credentials.
          BUN_DIR="$(dirname "$(command -v bun)")"
          set +e
          sudo bash -ec 'echo $$ > "$1/launcher/cgroup.procs"; shift; exec setpriv --reuid="$1" --regid="$2" --init-groups --bounding-set=-all --inh-caps=-all --ambient-caps=-all --no-new-privs env -i "${@:3}"' -- \
            "$DELEGATED_CGROUP" "$(id -u)" "$(id -g)" "PATH=$BUN_DIR:/usr/bin:/bin" \
            python3 "$GITHUB_WORKSPACE/tools/tfpolicy-supervisor/integration/real-owner.py" \
            --owner "$RUNNER_TEMP/native-bin/owner" --profile "$RUNNER_TEMP/native-owner-profile.json" \
            --plugin "$PLUGIN_PATH" --plugin-sha256 "$PLUGIN_SHA256" --plugin-version "$PLUGIN_VERSION" \
            --plugin-archive "$PLUGIN_ARCHIVE" --cgroup-root "$DELEGATED_CGROUP" \
            --repository "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/real-agent-results" \
            --agent-binary "$RUNNER_TEMP/native-bin/terrence-agent" \
            --agent-runner "$RUNNER_TEMP/native-bin/agent-landlock-runner" \
            --cases allow,deny,override,apply-crash,apply-cancel,agent-death \
            > "$RUNNER_TEMP/real-agent-private.log" 2>&1
          status=$?
          set -e
          HARNESS_STATUS="$status" python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          base = Path(os.environ['RUNNER_TEMP'])
          path = base/'real-agent-results/api/summary.json'
          expected = ['allow','deny','override','apply-crash','apply-cancel','agent-death']
          rows = json.loads(path.read_text())['nativeAgentCases'] if path.exists() else []
          passed = [row['mode'] for row in rows if row['passed'] is True]
          assert passed == expected[:len(rows)], 'unexpected agent compatibility case results'
          success = os.environ['HARNESS_STATUS'] == '0' and passed == expected
          provenance = json.loads((base/'native-agent-provenance.json').read_text())
          summary = {'version': os.environ['PLUGIN_VERSION'], **provenance,
                     'passed': passed, 'success': success,
                     'firstIncompleteCase': None if passed == expected else expected[len(passed)]}
          (base/'real-agent-summary.json').write_text(json.dumps(summary, indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
              output.write('Official tfpolicy-plugin '+summary['version']+': '+str(len(passed))+'/'+str(len(expected))+' production-agent compatibility cases passed.\n')
              output.write('Server '+summary['serverHead']+' (checkout '+summary['serverCheckout']+'), agent '+summary['agentRevision']+'.\n')
              if not success:
                  output.write('First incomplete case: '+str(summary['firstIncompleteCase'])+'. Raw plugin output remains private on the ephemeral runner.\n')
          if not success:
              raise SystemExit('Real-agent compatibility failed; see the case summary.')
          PYTHON
      - name: Require actual native qualification facilities
        if: steps.facilities.outputs.ready != 'true'
        run: |
          echo "::error::Native qualification did not run. See native-capabilities.json for missing host facilities."
          exit 1
      - name: Restore ephemeral runner settings and remove owned cgroup
        if: always()
        run: |
          set -euo pipefail
          if test -f "$RUNNER_TEMP/tfpolicy-original-core-pattern"; then
            sudo tee /proc/sys/kernel/core_pattern < "$RUNNER_TEMP/tfpolicy-original-core-pattern" >/dev/null
          fi
          if test -f "$RUNNER_TEMP/tfpolicy-owned-cgroup"; then
            ROOT="$(cat "$RUNNER_TEMP/tfpolicy-owned-cgroup")"
            test "$ROOT" = "/sys/fs/cgroup/tfpolicy-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if test -d "$ROOT"; then
              echo 1 | sudo tee "$ROOT/cgroup.kill" >/dev/null
              for n in {1..100}; do
                grep -q '^populated 0$' "$ROOT/cgroup.events" && break
                sleep 0.05
              done
              grep -q '^populated 0$' "$ROOT/cgroup.events"
              sudo find "$ROOT" -depth -mindepth 1 -type d -exec rmdir {} \;
              sudo rmdir "$ROOT"
            fi
          fi
      - name: Preserve capability report and actual qualification logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tfpolicy-native-qualification-${{ matrix.release }}
          path: |
            ${{ runner.temp }}/native-capabilities.json
            ${{ runner.temp }}/native-results
            ${{ runner.temp }}/native-owner-results.log
            ${{ runner.temp }}/official-plugin/provenance.json
            ${{ runner.temp }}/real-plugin-summary.json
            ${{ runner.temp }}/native-agent-provenance.json
            ${{ runner.temp }}/real-agent-summary.json
          if-no-files-found: error
          retention-days: 7
